name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          AI_PROVIDER: gemini
          GEMINI_API_KEY: test-gemini-key
          CUSTOMER_DATABASE_URL: postgresql+psycopg://u:p@127.0.0.1:5432/test
          API_KEY: test-api-key
          DEFAULT_WIDGET_ID: demo-widget
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/widget/package-lock.json
      - name: Install and build widget
        run: |
          npm ci || npm install
          npm run build
