<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Website — AI Chat Widget</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 48rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.6;
      }
      code {
        background: #f3f4f6;
        padding: 0.1rem 0.35rem;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <h1>Demo Burger Shop</h1>
    <p>
      This page demonstrates embedding the AI chat widget on an existing static site.
      The widget talks to the FastAPI service; database credentials stay on the server.
    </p>
    <p>
      For local development, run the API on port <code>8000</code> and the widget dev
      server or load the built bundle below.
    </p>

    <script>
      window.AiChatWidgetConfig = {
        widgetId: "demo-widget",
        apiBaseUrl: "http://localhost:8000",
        apiKey: "dev-api-key-change-me",
        title: "Ask about our menu",
        theme: "light",
      };
    </script>
    <!-- In production, host ai-chat-widget.js on your CDN -->
    <script type="module" src="http://localhost:5173/src/embed.tsx"></script>
  </body>
</html>
